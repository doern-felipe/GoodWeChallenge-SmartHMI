<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GoodWe Smart HMI — Protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   GOODWE SMART HMI — design tokens
   Palette: near-black industrial surfaces, GoodWe red accent,
   green/orange/red status colors. Deliberately ignores OS light
   mode — this simulates a physical charger touchscreen, which
   does not flip to a white theme with the OS.
   Type: Space Grotesk (display/numerals, technical + automotive
   feel) + Inter (UI/body, high legibility at small sizes).
   ============================================================ */
:root, :root:not([data-theme="light"]), :root[data-theme="dark"]{
  --bg-0:#050505;
  --bg-1:#0b0b0b;
  --bg-2:#151515;
  --bg-3:#1b1b1b;
  --border:#292929;
  --border-soft:#1e1e1e;
  --red:#EE1122;
  --red-strong:#ff2233;
  --red-dim:#3a0a0e;
  --green:#2ecc71;
  --green-dim:#123a24;
  --orange:#ff9f1c;
  --orange-dim:#3a2a0d;
  --text-0:#f5f5f5;
  --text-1:#a3a3a3;
  --text-2:#6e6e6e;
  --font-display:'Space Grotesk',-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-body:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-sm:6px; --r-md:10px; --r-lg:18px; --r-xl:26px;
  --shadow-card: 0 1px 0 rgba(255,255,255,0.02) inset, 0 12px 28px rgba(0,0,0,0.45);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --bg-0:#050505; --bg-1:#0b0b0b; --bg-2:#151515; --bg-3:#1b1b1b;
    --border:#292929; --border-soft:#1e1e1e;
    --red:#EE1122; --red-strong:#ff2233; --red-dim:#3a0a0e;
    --green:#2ecc71; --green-dim:#123a24; --orange:#ff9f1c; --orange-dim:#3a2a0d;
    --text-0:#f5f5f5; --text-1:#a3a3a3; --text-2:#6e6e6e;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-0);
  color:var(--text-0);
  font-family:var(--font-body);
  min-height:100vh;
  overflow-x:hidden;
}
button{font-family:inherit; cursor:pointer;}
:focus-visible{outline:2px solid var(--red); outline-offset:2px;}
::selection{background:var(--red); color:#fff;}
a{color:inherit;}

.app-shell{min-height:100vh; display:flex; flex-direction:column;}

/* ---------- Top nav ---------- */
.topnav{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 22px; background:var(--bg-1); border-bottom:1px solid var(--border-soft);
  position:sticky; top:0; z-index:40; gap:16px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:10px; cursor:pointer; background:none; border:none; padding:0;}
.brand-mark{font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:0.5px;}
.brand-mark .g1{color:var(--text-0);}
.brand-mark .g2{color:var(--red);}
.brand-sub{font-size:10px; color:var(--text-2); letter-spacing:2px; margin-top:1px;}

.nav-tabs{display:flex; gap:4px; background:var(--bg-2); border:1px solid var(--border-soft); border-radius:999px; padding:4px;}
.nav-tab{
  border:none; background:transparent; color:var(--text-1); font-size:13px; font-weight:600;
  padding:8px 16px; border-radius:999px; transition:all .18s ease; white-space:nowrap;
}
.nav-tab.active{background:var(--red); color:#fff;}
.nav-tab:not(.active):hover{color:var(--text-0); background:var(--bg-3);}

.topnav-right{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.mode-pill{
  font-size:11px; font-weight:700; letter-spacing:1px; padding:6px 12px; border-radius:999px;
  border:1px solid var(--border); color:var(--text-1); background:var(--bg-2);
}
.mode-pill.res{color:#fff; border-color:#3a3a3a;}
.mode-pill.op{color:var(--red); border-color:var(--red-dim); background:var(--red-dim);}

.status-toggle{
  display:flex; align-items:center; gap:7px; border:1px solid var(--border); background:var(--bg-2);
  padding:7px 12px; border-radius:999px; font-size:12px; font-weight:700; letter-spacing:0.5px; color:var(--text-1);
}
.status-toggle .dot{width:7px;height:7px;border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green);}
.status-toggle.offline .dot{background:var(--red); box-shadow:0 0 8px var(--red); animation:blink 1.6s infinite;}
.status-toggle.offline{color:var(--red);}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.35;}}

.lang-switch{display:flex; gap:2px; background:var(--bg-2); border:1px solid var(--border-soft); border-radius:999px; padding:3px;}
.lang-btn{border:none; background:transparent; color:var(--text-2); font-size:11px; font-weight:700; padding:5px 9px; border-radius:999px;}
.lang-btn.active{background:var(--bg-3); color:var(--text-0);}

.role-pill{
  font-size:11px; font-weight:700; color:var(--text-1); border:1px solid var(--border); background:var(--bg-2);
  padding:6px 12px; border-radius:999px; display:flex; align-items:center; gap:6px;
}

/* ---------- offline banner ---------- */
.offline-banner{
  background:linear-gradient(90deg, var(--orange-dim), #201409);
  border-bottom:1px solid var(--border-soft); color:var(--orange);
  font-size:12px; font-weight:700; letter-spacing:1px; text-align:center; padding:8px;
}

/* ---------- main content ---------- */
.main{flex:1; display:flex; flex-direction:column; align-items:center; width:100%; padding:36px 20px 100px;}
.container{width:100%; max-width:1180px;}

/* ---------- device frame (charger HMI look) ---------- */
.device-frame{
  width:100%; max-width:760px; margin:0 auto;
  background:radial-gradient(120% 140% at 50% -10%, #101010 0%, #060606 60%);
  border:1px solid var(--border); border-radius:var(--r-xl);
  padding:44px 40px 40px; box-shadow:var(--shadow-card);
  position:relative; overflow:hidden;
}
.device-frame::before{
  content:''; position:absolute; inset:0; pointer-events:none; border-radius:var(--r-xl);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.02);
}
.device-topline{display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;}
.device-topline .wordmark{font-family:var(--font-display); font-weight:700; font-size:14px; letter-spacing:3px; color:var(--text-2);}
.device-topline .mode-tag{font-size:11px; letter-spacing:2px; font-weight:700; color:var(--text-1);}

/* ---------- typography helpers ---------- */
.eyebrow{font-size:11px; letter-spacing:2px; font-weight:700; color:var(--text-2);}
.headline-xl{font-family:var(--font-display); font-weight:700; font-size:clamp(30px,5vw,44px); line-height:1.05; letter-spacing:-0.5px; margin:0;}
.headline-lg{font-family:var(--font-display); font-weight:700; font-size:28px; line-height:1.1; margin:0;}
.headline-md{font-family:var(--font-display); font-weight:600; font-size:20px; margin:0;}
.big-number{font-family:var(--font-display); font-weight:700; font-size:64px; line-height:1; letter-spacing:-1px;}
.muted{color:var(--text-1);}
.dim{color:var(--text-2);}

/* ---------- buttons ---------- */
.btn{
  border-radius:var(--r-md); border:1px solid var(--border); background:var(--bg-2); color:var(--text-0);
  font-weight:700; font-size:14px; padding:14px 22px; transition:all .15s ease; letter-spacing:0.2px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
}
.btn:hover{background:var(--bg-3); border-color:#3a3a3a;}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--red); border-color:var(--red); color:#fff;}
.btn-primary:hover{background:var(--red-strong); border-color:var(--red-strong);}
.btn-block{width:100%;}
.btn-lg{padding:20px 26px; font-size:16px; border-radius:var(--r-lg);}
.btn-ghost{background:transparent; border-color:var(--border);}
.btn-danger{color:var(--red); border-color:var(--red-dim); background:var(--red-dim);}
.btn:disabled{opacity:0.35; cursor:not-allowed;}
.btn-sm{padding:8px 14px; font-size:12px; border-radius:var(--r-sm);}

/* ---------- cards ---------- */
.card{background:var(--bg-2); border:1px solid var(--border-soft); border-radius:var(--r-lg); padding:22px;}
.card-hover{transition:all .18s ease; cursor:pointer;}
.card-hover:hover{border-color:#3a3a3a; background:var(--bg-3);}

/* ---------- landing ---------- */
.landing-hero{text-align:center; padding:60px 10px 20px;}
.landing-badge{display:inline-block; font-size:11px; letter-spacing:2px; font-weight:700; color:var(--text-2); border:1px solid var(--border); border-radius:999px; padding:6px 14px; margin-bottom:26px;}
.landing-title{font-family:var(--font-display); font-weight:700; letter-spacing:-1px; font-size:clamp(15px,3vw,17px);}
.landing-flow{
  font-family:var(--font-display); font-weight:700; font-size:clamp(28px,6vw,52px);
  line-height:1.12; letter-spacing:-1px; margin:18px 0 30px;
}
.landing-flow .accent{color:var(--red);}
.landing-note{max-width:560px; margin:0 auto 40px; color:var(--text-1); font-size:15px; line-height:1.6;}
.landing-actions{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-bottom:56px;}
.landing-diagram{
  border:1px solid var(--border-soft); background:var(--bg-1); border-radius:var(--r-lg);
  padding:30px 20px; max-width:820px; margin:0 auto; overflow-x:auto;
}
.diagram-tree{font-family:var(--font-display); font-size:12px; text-align:center; color:var(--text-1); white-space:pre; line-height:1.7; letter-spacing:0.5px;}
.diagram-tree .n1{color:var(--text-0); font-weight:700;}
.diagram-tree .n2{color:var(--red); font-weight:700;}

/* ---------- onboarding ---------- */
.onb-wrap{max-width:760px; margin:0 auto; text-align:center;}
.mode-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:34px; text-align:left;}
@media(max-width:640px){.mode-grid{grid-template-columns:1fr;}}
.mode-card{
  background:var(--bg-2); border:1px solid var(--border); border-radius:var(--r-lg); padding:28px;
  transition:all .18s ease; text-align:left;
}
.mode-card:hover{border-color:var(--red); background:var(--bg-3); transform:translateY(-2px);}
.mode-card .icon-tag{
  width:44px; height:44px; border-radius:var(--r-md); background:var(--red-dim); color:var(--red);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; margin-bottom:18px; font-size:15px;
}
.mode-card h3{font-family:var(--font-display); font-size:20px; margin:0 0 4px;}
.mode-card .tagline{color:var(--text-1); font-size:13px; margin-bottom:16px;}
.mode-card ul{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:8px;}
.mode-card li{font-size:13px; color:var(--text-1); display:flex; gap:8px; align-items:baseline;}
.mode-card li::before{content:'—'; color:var(--red);}

/* ---------- charger idle/status screens ---------- */
.charger-center{text-align:center; padding:10px 0 6px;}
.status-badge{
  display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:700; letter-spacing:1.5px;
  color:var(--text-1); border:1px solid var(--border); padding:8px 16px; border-radius:999px; margin-bottom:22px;
}
.status-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--text-2);}
.status-badge.ready .dot{background:var(--green); box-shadow:0 0 8px var(--green);}
.status-badge.ready{color:var(--green); border-color:var(--green-dim);}
.power-avail{font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--text-1); margin-bottom:36px;}
.power-avail b{color:var(--text-0); font-size:17px;}
.vehicle-state{font-size:14px; font-weight:700; letter-spacing:1px; color:var(--text-2); margin-bottom:30px;}

.metric-row{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:26px 0;}
.metric{background:var(--bg-1); border:1px solid var(--border-soft); border-radius:var(--r-md); padding:16px; text-align:center;}
.metric .val{font-family:var(--font-display); font-weight:700; font-size:22px;}
.metric .lbl{font-size:10px; letter-spacing:1.5px; color:var(--text-2); margin-top:4px; font-weight:700;}

/* ---------- ring progress ---------- */
.ring-wrap{display:flex; justify-content:center; margin:8px 0 30px; position:relative;}
.ring-center{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center;}
.ring-center .pct{font-family:var(--font-display); font-weight:700; font-size:46px; line-height:1;}
.ring-center .pct-lbl{font-size:11px; color:var(--text-2); letter-spacing:2px; margin-top:6px; font-weight:700;}

.action-row{display:flex; gap:12px; margin-top:20px; flex-wrap:wrap;}
.action-row .btn{flex:1; min-width:150px;}

.quick-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-top:22px;}
.quick-btn{
  background:var(--bg-1); border:1px solid var(--border-soft); border-radius:var(--r-md); padding:14px 10px;
  text-align:center; font-size:12px; font-weight:700; letter-spacing:0.4px; color:var(--text-1);
}
.quick-btn:hover{border-color:#3a3a3a; color:var(--text-0);}
.quick-btn.active{border-color:var(--red); color:var(--red); background:var(--red-dim);}

/* ---------- settings sections ---------- */
.settings-section{margin-bottom:26px;}
.settings-section h4{font-family:var(--font-display); font-size:14px; letter-spacing:1px; color:var(--text-1); margin:0 0 12px; text-transform:uppercase;}
.chip-row{display:flex; gap:8px; flex-wrap:wrap;}
.chip{
  border:1px solid var(--border); background:var(--bg-1); color:var(--text-1); font-weight:700; font-size:13px;
  padding:10px 16px; border-radius:999px;
}
.chip.active{border-color:var(--red); background:var(--red); color:#fff;}
.toggle-row{display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--border-soft);}
.toggle-row:last-child{border-bottom:none;}
.toggle-row .t-label{font-size:14px; font-weight:600;}
.toggle-row .t-sub{font-size:12px; color:var(--text-2); margin-top:2px;}
.switch{width:46px; height:26px; border-radius:999px; background:var(--bg-3); border:1px solid var(--border); position:relative; flex-shrink:0;}
.switch.on{background:var(--red); border-color:var(--red);}
.switch::after{content:''; position:absolute; width:20px; height:20px; border-radius:50%; background:#fff; top:2px; left:2px; transition:all .18s ease;}
.switch.on::after{left:22px;}

.field-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0;}
.field-row label{font-size:13px; color:var(--text-1); font-weight:600;}
.field-row select, .field-row input[type=time]{
  background:var(--bg-1); border:1px solid var(--border); color:var(--text-0); border-radius:var(--r-sm);
  padding:9px 12px; font-family:inherit; font-size:13px; font-weight:600;
}
.days-row{display:flex; gap:6px; margin-top:8px;}
.day-chip{width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:var(--bg-1); color:var(--text-1); font-size:11px; font-weight:700;}
.day-chip.on{background:var(--red); border-color:var(--red); color:#fff;}

/* ---------- profiles ---------- */
.profile-list{display:flex; flex-direction:column; gap:10px;}
.profile-item{display:flex; justify-content:space-between; align-items:center; background:var(--bg-1); border:1px solid var(--border-soft); border-radius:var(--r-md); padding:16px 18px;}
.profile-item .name{font-weight:700; font-size:14px;}
.profile-item .meta{font-size:12px; color:var(--text-2); margin-top:3px;}
.profile-avatar{width:36px; height:36px; border-radius:50%; background:var(--bg-3); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:13px; color:var(--red); margin-right:12px;}
.profile-item-left{display:flex; align-items:center;}
.sync-note{font-size:12px; color:var(--text-2); text-align:center; margin-top:18px; line-height:1.6;}

/* ---------- commercial auth ---------- */
.auth-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:26px;}
@media(max-width:560px){.auth-grid{grid-template-columns:1fr;}}
.auth-opt{background:var(--bg-1); border:1px solid var(--border); border-radius:var(--r-lg); padding:26px 14px; text-align:center;}
.auth-opt:hover{border-color:var(--red); background:var(--bg-3);}
.auth-opt .ic{font-family:var(--font-display); font-weight:700; font-size:22px; color:var(--red); margin-bottom:10px;}
.auth-opt .lb{font-size:13px; font-weight:700; letter-spacing:1px;}
.scan-pulse{width:120px; height:120px; margin:20px auto; border-radius:50%; border:2px solid var(--red); position:relative; display:flex; align-items:center; justify-content:center;}
.scan-pulse::before, .scan-pulse::after{
  content:''; position:absolute; inset:0; border-radius:50%; border:2px solid var(--red); opacity:0.6;
  animation:pulse-ring 1.6s ease-out infinite;
}
.scan-pulse::after{animation-delay:.8s;}
@keyframes pulse-ring{0%{transform:scale(1); opacity:.7;} 100%{transform:scale(1.9); opacity:0;}}
.scan-pulse span{font-family:var(--font-display); font-weight:700; font-size:13px; color:var(--red);}

.rfid-result{background:var(--bg-1); border:1px solid var(--border-soft); border-radius:var(--r-lg); padding:22px; margin-top:20px; text-align:left;}
.rfid-row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border-soft); font-size:13px;}
.rfid-row:last-child{border-bottom:none;}
.rfid-row .k{color:var(--text-2);}
.rfid-row .v{font-weight:700;}

.power-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:18px;}
@media(max-width:500px){.power-grid{grid-template-columns:repeat(2,1fr);}}
.power-opt{background:var(--bg-1); border:1px solid var(--border); border-radius:var(--r-md); padding:16px 8px; text-align:center; font-weight:700;}
.power-opt.active{border-color:var(--red); background:var(--red-dim); color:var(--red);}
.power-opt:disabled{opacity:.3;}
.power-limit-note{font-size:11px; color:var(--text-2); text-align:center; margin-top:12px;}

.cost-row{display:flex; justify-content:space-between; gap:14px; margin:22px 0;}
.cost-box{flex:1; background:var(--bg-1); border:1px solid var(--border-soft); border-radius:var(--r-md); padding:16px; text-align:center;}
.cost-box .val{font-family:var(--font-display); font-weight:700; font-size:20px; color:var(--red);}
.cost-box .lbl{font-size:10px; letter-spacing:1px; color:var(--text-2); font-weight:700; margin-top:4px;}

/* ---------- operator dashboard ---------- */
.op-header{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px; flex-wrap:wrap; gap:16px;}
.op-stats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:28px;}
@media(max-width:760px){.op-stats{grid-template-columns:repeat(2,1fr);}}
.op-stat{background:var(--bg-2); border:1px solid var(--border-soft); border-radius:var(--r-lg); padding:18px;}
.op-stat .num{font-family:var(--font-display); font-weight:700; font-size:30px;}
.op-stat .lbl{font-size:11px; color:var(--text-2); letter-spacing:1px; margin-top:4px; font-weight:700;}
.op-stat.charging .num{color:var(--red);}
.op-stat.available .num{color:var(--green);}
.op-stat.maintenance .num{color:var(--orange);}
.op-stat.error .num{color:var(--red-strong);}

.station-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
.station-tile{
  background:var(--bg-2); border:1px solid var(--border-soft); border-radius:var(--r-md); padding:14px;
  text-align:left; position:relative; overflow:hidden;
}
.station-tile:hover{border-color:#3a3a3a; background:var(--bg-3);}
.station-tile .sid{font-family:var(--font-display); font-weight:700; font-size:15px;}
.station-tile .sstatus{font-size:10px; font-weight:700; letter-spacing:1px; margin-top:6px; display:inline-flex; align-items:center; gap:5px;}
.station-tile .sdot{width:6px; height:6px; border-radius:50%;}
.station-tile .spower{font-size:11px; color:var(--text-2); margin-top:8px;}
.st-charging .sdot{background:var(--red);} .st-charging .sstatus{color:var(--red);}
.st-available .sdot{background:var(--green);} .st-available .sstatus{color:var(--green);}
.st-maintenance .sdot{background:var(--orange);} .st-maintenance .sstatus{color:var(--orange);}
.st-error .sdot{background:var(--red-strong); box-shadow:0 0 6px var(--red-strong);} .st-error .sstatus{color:var(--red-strong);}

.op-detail-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:20px;}
@media(max-width:760px){.op-detail-grid{grid-template-columns:1fr;}}
.detail-row{display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border-soft); font-size:13px;}
.detail-row:last-child{border-bottom:none;}
.detail-row .k{color:var(--text-2); font-weight:600;}

.settings-menu-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px;}

.diag-item:last-child{border-bottom:none;}

.diag-err-box{background:var(--red-dim); border:1px solid var(--red-dim); border-radius:var(--r-lg); padding:22px; text-align:center;}

/* ---------- modal / overlay ---------- */
.overlay{position:fixed; inset:0; background:rgba(2,2,2,0.78); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0;} to{opacity:1;}}

var NAMES = ['João Silva','Maria Fernandes','Carlos Souza','Ana Paula','Rafael Lima','Bruno Costa','Fernanda Dias','Patrícia Alves','Marcos Rocha','Juliana Melo'];

function buildStations(){
  var errorIdx = 3, maintIdx = 5, availableIdx = [1,2,7,12];
  var list = [];
  for(var i=1;i<=24;i++){
    var status;
    if(i===errorIdx) status='error';
    else if(i===maintIdx) status='maintenance';
    else if(availableIdx.indexOf(i)!==-1) status='available';
    else status='charging';
    var st = {id:i, status:status};
    if(status==='charging'){
      var seed = (i*37)%100;
      st.power = i===4 ? 18.4 : +(7.4 + (seed%15)*1.0).toFixed(1);
      st.user = i===4 ? 'João Silva' : NAMES[i%NAMES.length];
      st.energyKwh = i===4 ? 12.7 : +((st.power*0.55)+(seed%5)).toFixed(1);
      st.elapsedSec = i===4 ? (37*60+21) : ((seed*47)%3300)+120;
      st.tariff = 1.89;
      st.cost = +(st.energyKwh*st.tariff).toFixed(2);
      st.rfid = '****'+(4000+ (i*37)%9000);
      st.payment = 'Visa ••••'+(1000+(i*77)%9000);
    }
    list.push(st);
  }
  return list;
}

/* ============================================================
   TICKER — simulates charging in real time
   ============================================================ */
setInterval(function(){
  var dirty=false;
  if(state.mode==='residential' && state.res.vehicle==='charging'){
    var r=state.res;
    r.elapsedSec += 1;
    r.energyKwh += r.power/3600;
    var capacityKwh = 60;
    r.battery = Math.min(r.target, r.battery + (r.power/3600)/capacityKwh*100);
    if(r.battery>=r.target){ r.vehicle='completed'; }
    dirty=true;
  }
  if(state.mode==='commercial' && state.comm.authStep==='charging'){
    var c=state.comm;
    c.elapsedSec += 1;
    c.energyKwh += c.power/3600;
    c.cost = +(c.energyKwh*c.tariff).toFixed(2);
    c.battery = Math.min(100, c.battery + (c.power/3600)/55*100);
    dirty=true;
  }
  if(dirty && ((state.mode==='residential' && state.res.sub==='charger') || (state.mode==='commercial' && state.comm.sub==='charger'))){
    render();
  }
}, 1000);

/* ============================================================

function fmtTime(sec){
  sec = Math.floor(sec);
  var h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  function p(n){ return String(n).padStart(2,'0'); }
  return h>0 ? (p(h)+':'+p(m)+':'+p(s)) : (p(m)+':'+p(s));
}
function fmtRemain(sec){
  sec = Math.max(0, Math.floor(sec));
  var h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60);
  return (h>0?h+'h ':'') + m+'min';
}
function esc(s){ return String(s); }
function ringSvg(pct, colorVar, size, stroke){
  size = size||220; stroke = stroke||14;
  var r=(size-stroke)/2, c=2*Math.PI*r;
  var off = c - (Math.min(100,Math.max(0,pct))/100)*c;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--bg-1)" stroke-width="'+stroke+'" />'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+colorVar+'" stroke-width="'+stroke+'" stroke-linecap="round" '+
      'stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 '+size/2+' '+size/2+')" style="transition:stroke-dashoffset .5s ease" />'+
  '</svg>';
}

function selectMode(m){
  state.mode = m;
  if(m==='residential'){ state.screen='residential'; state.res.sub='charger'; }
  else { state.screen='commercial'; state.role='user'; state.comm.sub='charger'; state.opSub='hub'; }
  render();
}

function closeChangeModeConfirm(){ state.changeModeConfirm=false; render(); }

  state.changeModeConfirm=false;

  state.role='user';
  state.screen='onboarding';
  render();
}

function toggleOnline(){
  if(state.online){
    state.online=false;
    render();
  } else {
    state.syncing=true;
    state.syncStep=0;
    render();
    var steps=6;
    var iv=setInterval(function(){
      state.syncStep++;
      render();
      if(state.syncStep>=steps){
        clearInterval(iv);
        setTimeout(function(){
          state.syncing=false;
          state.online=true;
          render();
        }, 700);
      }
    }, 350);
  }
}

function setLang(l){ state.lang=l; render(); }
function toggleDemo(){ state.demoOpen=!state.demoOpen; render(); }
function toggleRole(){ state.role = state.role==='user' ? 'operator' : 'user'; state.opSub='hub'; render(); }

/* --- demo shortcuts --- */
function demoSet(kind, val){
  if(kind==='res-vehicle'){ state.mode='residential'; state.screen='residential'; state.res.sub='charger'; state.res.vehicle=val; if(val==='connected'){state.res.battery=42;} }
  if(kind==='comm-step'){ state.mode='commercial'; state.role='user'; state.screen='commercial'; state.comm.sub='charger'; state.comm.authStep=val;
    if(val==='result'){ state.comm.userName='João Silva'; state.comm.authMethod='rfid'; }
    if(val==='charging'){ state.comm.userName='João Silva'; state.comm.power=18.4; }
  }
  if(kind==='online'){ state.online = val==='online'; state.syncing=false; }
  if(kind==='demand'){ state.mode='commercial'; state.role='operator'; state.screen='commercial'; state.opSub='loadmgmt'; state.siteLimit=300; }
  if(kind==='maintenance'){ state.mode='commercial'; state.role='operator'; state.screen='commercial'; state.opSub='station'; state.selectedStationId=5; }
  if(kind==='error-station'){ state.mode='commercial'; state.role='operator'; state.screen='commercial'; state.opSub='station'; state.selectedStationId=3; }
  state.demoOpen=false;
  render();
}

/* ============================================================
   EVENT DELEGATION
   ============================================================ */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var a = el.dataset.action;
  var v = el.dataset.value;
  switch(a){
    case 'goto': go(v); break;
    case 'select-mode': selectMode(v); break;
    case 'open-change-mode': openChangeModeConfirm(); break;
    case 'close-change-mode': closeChangeModeConfirm(); break;
    case 'confirm-change-mode': confirmChangeMode(); break;
    case 'toggle-online': toggleOnline(); break;
    case 'set-lang': setLang(v); break;
    case 'toggle-demo': toggleDemo(); break;
    case 'toggle-role': toggleRole(); break;
    case 'res-nav': resNav(v); break;
    case 'res-connect': resConnect(); break;
    case 'res-start': resStart(); break;
    case 'res-pause': resPause(); break;
    case 'res-resume': resResume(); break;
    case 'res-stop': resStop(); break;
    case 'res-new': resNewSession(); break;
    case 'res-set-limit': resSetLimit(v); break;
    case 'res-toggle-lock': resToggleLock(); break;
    case 'res-toggle-loadmgmt': resToggleLoadMgmt(); break;
    case 'res-set-timer': resSetTimer(+v); break;
    case 'res-toggle-schedule': resToggleSchedule(); break;
    case 'res-toggle-day': resToggleDay(v); break;
    case 'comm-nav': commNav(v); break;
    case 'comm-choose-auth': commChooseAuth(v); break;
    case 'comm-go-power': commGoPowerSelect(); break;
    case 'comm-select-power': commSelectPower(+v); break;
    case 'comm-start': commStart(); break;
    case 'comm-pause': commPause(); break;
    case 'comm-resume': commResume(); break;
    case 'comm-stop': commStop(); break;
    case 'comm-new': commNewSession(); break;
    case 'comm-simulate-error': commSimulateError(); break;
    case 'comm-retry': commRetry(); break;
    case 'op-nav': opNav(v); break;
    case 'op-select-station': opSelectStation(+v); break;
    case 'op-back-hub': opBackHub(); break;
    case 'op-open-setting': opOpenSetting(v); break;
    case 'demo-set': demoSet(el.dataset.kind, v); break;
    case 'noop': break;
  }
});
document.addEventListener('input', function(e){
  var el = e.target.closest('[data-bind]');
  if(!el) return;
  var b = el.dataset.bind;
  if(b==='site-limit'){ opSetSiteLimit(el.value); renderLoadMgmtOnly(); }
  if(b==='schedule-start'){ resSetScheduleField('start', el.value); }
  if(b==='schedule-end'){ resSetScheduleField('end', el.value); }
});

function renderLoadMgmtOnly(){
  var demandEl = document.getElementById('demand-val');
  if(demandEl) demandEl.textContent = state.siteLimit + ' kW';
  render();
}

/* ============================================================
   COMMERCIAL MODE
   ============================================================ */
function screenCommercial(){
  if(state.role==='operator'){
    var body='';
    if(state.opSub==='hub') body = opHubScreen();
    else if(state.opSub==='station') body = opStationScreen();
    else if(state.opSub==='loadmgmt') body = opLoadMgmtScreen();
    else if(state.opSub==='settings') body = opSettingsGridScreen();
    else if(state.opSub==='settingDetail') body = opSettingDetailScreen();
    return '<div class="container fade-in">'+body+'</div>';
  }
  var body='';
  if(state.comm.sub==='charger') body = commChargerFlow();
  else if(state.comm.sub==='activity') body = commActivityScreen();
  else if(state.comm.sub==='settings') body = commSettingsScreen();
  else if(state.comm.sub==='diagnostics') body = commDiagnosticsScreen();
  return '<div class="container fade-in">'+body+'</div>';
}

function commChargerFlow(){
  var c = state.comm;
  var inner='';
  if(c.authStep==='idle'){
    inner = '<div class="charger-center">' +
      '<span class="status-badge ready"><span class="dot"></span>'+t('ready')+'</span>' +
      '<div class="power-avail"><b>22 kW</b> '+t('available_p')+'</div>' +
      '<div class="vehicle-state">'+t('station_auth')+'</div>' +
      '<div class="auth-grid">' +
        '<button class="auth-opt" data-action="comm-choose-auth" data-value="rfid"><div class="ic">◈</div><div class="lb">'+t('rfid')+'</div></button>' +
        '<button class="auth-opt" data-action="comm-choose-auth" data-value="qr"><div class="ic">▦</div><div class="lb">'+t('qr')+'</div></button>' +
        '<button class="auth-opt" data-action="comm-choose-auth" data-value="app"><div class="ic">▣</div><div class="lb">'+t('app')+'</div></button>' +
      '</div>' +
    '</div>';
  } else if(c.authStep==='scanning'){
    inner = '<div class="charger-center">' +
      '<div class="scan-pulse"><span>'+ (c.authMethod||'').toUpperCase() +'</span></div>' +
      '<div class="vehicle-state">'+t('station_auth')+'…</div>' +
    '</div>';
  } else if(c.authStep==='result'){
    inner = '<div class="charger-center" style="text-align:left;">' +
      '<div style="text-align:center;"><span class="status-badge ready"><span class="dot"></span>'+t('rfid_detected')+'</span></div>' +
      '<h3 class="headline-md" style="text-align:center; margin-bottom:10px;">'+c.userName+'</h3>' +
      '<div class="rfid-result">' +
        '<div class="rfid-row"><span class="k">'+t('account')+'</span><span class="v">'+t('personal')+'</span></div>' +
        '<div class="rfid-row"><span class="k">'+t('payment')+'</span><span class="v">Visa ••••1234</span></div>' +
        '<div class="rfid-row"><span class="k">'+t('tariff')+'</span><span class="v">R$ '+c.tariff.toFixed(2)+' / kWh</span></div>' +
        '<div class="rfid-row"><span class="k">'+t('avail_power')+'</span><span class="v">22 kW</span></div>' +
      '</div>' +
      '<button class="btn btn-primary btn-lg btn-block" data-action="comm-go-power" style="margin-top:20px;">'+t('start_charging')+'</button>' +
    '</div>';
  } else if(c.authStep==='power-select'){
    var options=[7.4,11,16,22];
    inner = '<div class="charger-center">' +
      '<h3 class="headline-md">'+t('select_power')+'</h3>' +
      '<div class="power-grid">' + options.map(function(p){
        var disabled = p>c.stationMax;
        return '<button class="power-opt '+(c.selectedPower===p?'active':'')+'" '+(disabled?'disabled':'')+' data-action="comm-select-power" data-value="'+p+'">'+p+' kW</button>';
      }).join('') + '</div>' +
      '<div class="power-limit-note">'+t('power_limit_note')+'</div>' +
      '<button class="btn btn-primary btn-lg btn-block" data-action="comm-start" style="max-width:340px; margin:22px auto 0;">'+t('start_charging')+'</button>' +
    '</div>';
  } else if(c.authStep==='charging' || c.authStep==='paused'){
    var pct = Math.round(c.battery);
    var remainSec = (c.power>0) ? ((100-c.battery)/100*55)/c.power*3600 : 0;
    inner = '<div class="charger-center">' +
      '<span class="status-badge '+(c.authStep==='charging'?'ready':'')+'"><span class="dot"></span>'+(c.authStep==='charging'?t('charging'):t('pause_charging'))+'</span>' +
      '<div class="ring-wrap">' + ringSvg(pct,'var(--red)',200,13) +
        '<div class="ring-center"><div class="pct">'+pct+'%</div><div class="pct-lbl">'+c.power+' kW</div></div>' +
      '</div>' +
      '<div class="metric-row">' +
        '<div class="metric"><div class="val">'+c.energyKwh.toFixed(1)+' kWh</div><div class="lbl">'+t('energy')+'</div></div>' +
        '<div class="metric"><div class="val">'+fmtTime(c.elapsedSec)+'</div><div class="lbl">'+t('time')+'</div></div>' +
        '<div class="metric"><div class="val">~'+fmtRemain(remainSec)+'</div><div class="lbl">'+t('estimated_remaining')+'</div></div>' +
      '</div>' +
      '<div class="cost-row">' +
        '<div class="cost-box"><div class="val">R$ '+c.cost.toFixed(2)+'</div><div class="lbl">'+t('estimated_cost')+'</div></div>' +
        '<div class="cost-box"><div class="val">R$ '+c.tariff.toFixed(2)+'</div><div class="lbl">'+t('tariff')+' /kWh</div></div>' +
        '<div class="cost-box"><div class="val">Visa</div><div class="lbl">••••1234</div></div>' +
      '</div>' +
      '<div class="action-row" style="max-width:420px; margin:0 auto;">' +
        (c.authStep==='charging' ?
          '<button class="btn btn-lg" data-action="comm-pause">'+t('pause')+'</button>' :
          '<button class="btn btn-primary btn-lg" data-action="comm-resume">'+t('resume_charging')+'</button>') +
        '<button class="btn btn-danger btn-lg" data-action="comm-stop">'+t('stop')+'</button>' +
      '</div>' +
    '</div>';
  } else if(c.authStep==='completed'){
    inner = '<div class="charger-center">' +
      '<span class="status-badge ready"><span class="dot"></span>'+t('completed')+'</span>' +
      '<div class="ring-wrap">' + ringSvg(100,'var(--green)',200,13) +
        '<div class="ring-center"><div class="pct">R$</div><div class="pct-lbl">'+c.cost.toFixed(2)+'</div></div>' +
      '</div>' +
      '<div class="metric-row">' +
        '<div class="metric"><div class="val">'+c.energyKwh.toFixed(1)+' kWh</div><div class="lbl">'+t('energy')+'</div></div>' +
        '<div class="metric"><div class="val">'+fmtTime(c.elapsedSec)+'</div><div class="lbl">'+t('time')+'</div></div>' +
        '<div class="metric"><div class="val">Visa</div><div class="lbl">'+t('payment')+'</div></div>' +
      '</div>' +
      '<button class="btn btn-primary btn-lg btn-block" data-action="comm-new" style="max-width:340px; margin:6px auto 0;">'+t('new_session')+'</button>' +
    '</div>';
  }
  return '<div class="device-frame">' +
    '<div class="device-topline"><span class="wordmark">GOODWE · '+t('station')+' 04</span><span class="mode-tag">'+t('commercial')+'</span></div>' +
    inner +
  '</div>';
}

/* ---------- operator: hub ---------- */
function opHubScreen(){
  var counts = {charging:0, available:0, maintenance:0, error:0};
  state.stations.forEach(function(s){ counts[s.status]++; });
  return '' +
  '<div class="op-header">' +
    '<div><span class="eyebrow">'+t('operator_mode')+'</span><h1 class="headline-lg" style="margin-top:6px;">'+t('hub_title')+'</h1></div>' +
  '</div>' +
  '<div class="op-stats">' +
    '<div class="op-stat"><div class="num">'+state.stations.length+'</div><div class="lbl">'+t('stations_total')+'</div></div>' +
    '<div class="op-stat charging"><div class="num">'+counts.charging+'</div><div class="lbl">'+t('charging_c')+'</div></div>' +
    '<div class="op-stat available"><div class="num">'+counts.available+'</div><div class="lbl">'+t('available_c')+'</div></div>' +
    '<div class="op-stat maintenance"><div class="num">'+counts.maintenance+'</div><div class="lbl">'+t('maintenance_c')+'</div></div>' +
  '</div>' +
  '<div class="station-grid">' + state.stations.map(function(s){
    return '<button class="station-tile st-'+s.status+'" data-action="op-select-station" data-value="'+s.id+'">' +
      '<div class="sid">'+t('station')+' '+String(s.id).padStart(2,'0')+'</div>' +
      '<div class="sstatus"><span class="sdot"></span>'+statusLabel(s.status)+'</div>' +
      (s.status==='charging' ? '<div class="spower">'+s.power+' kW · '+s.user.split(' ')[0]+'</div>' : '<div class="spower">&nbsp;</div>') +
    '</button>';
  }).join('') + '</div>';
}
function statusLabel(s){
  if(s==='charging') return t('charging_c');
  if(s==='available') return t('available_c');
  if(s==='maintenance') return t('maintenance_c');
  if(s==='error') return t('error_c');
  return s;
}

function opStationScreen(){
  var s = state.stations.filter(function(x){ return x.id===state.selectedStationId; })[0] || state.stations[0];
  var isCharging = s.status==='charging';
  return '' +
  '<button class="back-link" data-action="op-back-hub">← '+t('hub_title')+'</button>' +
  '<div class="op-header"><div><span class="eyebrow">'+t('station_detail')+'</span>' +
    '<h1 class="headline-lg" style="margin-top:6px;">'+t('station')+' '+String(s.id).padStart(2,'0')+'</h1></div>' +
    '<span class="mode-pill '+(s.status==='error'?'op':'')+'" style="color:'+(s.status==='available'?'var(--green)':s.status==='maintenance'?'var(--orange)':s.status==='error'?'var(--red-strong)':'var(--red)')+';">'+statusLabel(s.status)+'</span>' +
  '</div>' +
  '<div class="op-detail-grid">' +
    '<div class="card">' +
      (isCharging ? (
        '<div class="detail-row"><span class="k">'+t('status')+'</span><span class="v">'+statusLabel(s.status)+'</span></div>' +
        '<div class="detail-row"><span class="k">'+t('user')+'</span><span class="v">'+s.user+'</span></div>' +
        '<div class="detail-row"><span class="k">'+t('power')+'</span><span class="v">'+s.power+' kW</span></div>' +
        '<div class="detail-row"><span class="k">'+t('energy')+'</span><span class="v">'+s.energyKwh+' kWh</span></div>' +
        '<div class="detail-row"><span class="k">'+t('session')+'</span><span class="v">'+fmtTime(s.elapsedSec)+'</span></div>' +
        '<div class="detail-row"><span class="k">'+t('cost')+'</span><span class="v">R$ '+s.cost.toFixed(2)+'</span></div>' +
        '<div class="detail-row"><span class="k">'+t('rfid')+'</span><span class="v">'+s.rfid+'</span></div>' +
        '<div class="detail-row"><span class="k">'+t('payment')+'</span><span class="v">'+s.payment+'</span></div>'
      ) : s.status==='error' ? (
        '<div class="diag-err-box"><h3 class="headline-md" style="color:var(--red-strong);">'+t('vehicle_comm_error')+'</h3>' +
        '<div class="action-row" style="flex-direction:column; margin-top:16px;">' +

      ) : s.status==='maintenance' ? (

        '<p class="muted" style="font-size:13px; margin-top:14px;">'+(state.lang==='pt'?'Estação marcada para manutenção programada pela equipe técnica.':'Station flagged for scheduled maintenance by the technical team.')+'</p>'
      ) : (
        '<div class="detail-row"><span class="k">'+t('status')+'</span><span class="v" style="color:var(--green)">'+t('available_c')+'</span></div>' +
        '<p class="muted" style="font-size:13px; margin-top:14px;">'+(state.lang==='pt'?'Pronta para uma nova sessão de carregamento.':'Ready for a new charging session.')+'</p>'
      )) +

function opLoadMgmtScreen(){
  var demand = state.stations.filter(function(s){return s.status==='charging';}).reduce(function(a,s){return a+s.power;},0);
  var chargingStations = state.stations.filter(function(s){return s.status==='charging';}).slice(0,8);
  var maxBar = Math.max(state.siteLimit, demand);
  return '' +
  '<div class="op-header"><div><span class="eyebrow">'+t('operator_mode')+'</span><h1 class="headline-lg" style="margin-top:6px;">'+t('load_management')+'</h1></div>' +
    '<span class="mode-pill op">'+t('load_mgmt_active')+'</span></div>' +
  '<div class="op-stats" style="grid-template-columns:1fr 1fr;">' +
    '<div class="op-stat"><div class="num">'+state.siteLimit+' kW</div><div class="lbl">'+t('site_power_limit')+'</div></div>' +
    '<div class="op-stat charging"><div class="num" id="demand-val">'+Math.round(demand)+' kW</div><div class="lbl">'+t('current_demand')+'</div></div>' +
  '</div>' +
  '<div class="card" style="margin-bottom:20px;">' +
    '<div class="field-row" style="padding-top:0;"><label>'+t('site_power_limit')+'</label><span class="muted">'+state.siteLimit+' kW</span></div>' +
    '<input type="range" min="100" max="400" step="10" value="'+state.siteLimit+'" data-bind="site-limit" style="width:100%; accent-color:var(--red);">' +
  '</div>' +
  '<div class="card">' +
    '<h4 style="font-family:var(--font-display); font-size:13px; letter-spacing:1px; margin:0 0 14px;">'+t('stations_total')+'</h4>' +
    chargingStations.map(function(s){
      var pct = Math.min(100, (s.power/maxBar)*100);
      return '<div class="load-bar-row"><div class="sname">'+t('station')+' '+String(s.id).padStart(2,'0')+'</div>' +
        '<div class="load-bar-track"><div class="load-bar-fill" style="width:'+pct+'%"></div></div>' +
        '<div class="load-bar-val">'+s.power+' kW</div></div>';
    }).join('') +
  '</div>';
}

  {key:'network', pt:'Rede', en:'Network', es:'Red', d_pt:'Configuração de conectividade das estações.', d_en:'Station connectivity configuration.', d_es:'Configuración de conectividad de estaciones.'},
  {key:'firmware', pt:'Firmware', en:'Firmware', es:'Firmware', d_pt:'Versões de firmware e atualizações OTA.', d_en:'Firmware versions and OTA updates.', d_es:'Versiones de firmware y actualizaciones OTA.'},
  {key:'integrations', pt:'Integrações', en:'Integrations', es:'Integraciones', d_pt:'OCPP, MODBUS e sistemas de terceiros.', d_en:'OCPP, MODBUS and third-party systems.', d_es:'OCPP, MODBUS y sistemas de terceros.'},
  {key:'administration', pt:'Administração', en:'Administration', es:'Administración', d_pt:'Permissões da plataforma e organização.', d_en:'Platform permissions and organization.', d_es:'Permisos de la plataforma y organización.'}
];
function opSettingsGridScreen(){
  return '<div class="op-header"><div><span class="eyebrow">'+t('operator_mode')+'</span><h1 class="headline-lg" style="margin-top:6px;">'+t('admin_settings')+'</h1></div></div>' +
    '<div class="settings-menu-grid">' + SETTING_SECTIONS.map(function(s){
      return '<button class="setting-tile" data-action="op-open-setting" data-value="'+s.key+'">' +
        '<div class="stitle">'+s[state.lang]+'</div><div class="sdesc">'+s['d_'+state.lang]+'</div></button>';
    }).join('') + '</div>';
}
function opSettingDetailScreen(){
  var s = SETTING_SECTIONS.filter(function(x){return x.key===state.opSettingKey;})[0] || SETTING_SECTIONS[0];
  var sampleRows = [];
  if(s.key==='users'){
    sampleRows = ['João Silva · Personal · Visa ••••1234','Maria Fernandes · Business · Mastercard ••••9012','Carlos Souza · Personal · Visa ••••4521'];
  } else if(s.key==='tariffs'){
    sampleRows = ['Ponta (18:00–21:00) · R$ 2,49 / kWh','Intermediária · R$ 1,89 / kWh','Fora de ponta · R$ 1,32 / kWh'];
  } else if(s.key==='powerlimits'){
    sampleRows = state.stations.slice(0,6).map(function(st){ return t('station')+' '+String(st.id).padStart(2,'0')+' · '+(7.4+ (st.id%3)*7.4).toFixed(1)+' kW max'; });
  } else if(s.key==='firmware'){
    sampleRows = ['HMI Core · v3.2.1 · '+(state.lang==='pt'?'atualizado':'up to date'),'Power Controller · v1.8.0 · '+(state.lang==='pt'?'atualizado':'up to date'),'Comms Module · v2.0.4 · OTA '+(state.lang==='pt'?'disponível':'available')];
  } else if(s.key==='network'){
    sampleRows = ['4G/LTE · '+(state.lang==='pt'?'Conectado':'Connected'),'Ethernet · '+(state.lang==='pt'?'Conectado':'Connected'),'Wi-Fi backup · '+(state.lang==='pt'?'Em espera':'Standby')];
  } else {
    sampleRows = [(state.lang==='pt'?'Nenhum dado adicional configurado neste protótipo.':state.lang==='en'?'No additional data configured in this prototype.':'No hay datos adicionales configurados en este prototipo.')];
  }
  return '<button class="back-link" data-action="op-nav" data-value="settings">← '+t('admin_settings')+'</button>' +
    '<h1 class="headline-lg" style="margin-bottom:18px;">'+s[state.lang]+'</h1>' +
    '<div class="card">' + sampleRows.map(function(r){
      return '<div class="detail-row"><span class="v" style="font-weight:600;">'+r+'</span></div>';
    }).join('') + '</div>';
}

/* ============================================================
   MODALS
   ============================================================ */
function renderChangeModeModal(){
  if(!state.changeModeConfirm) return '';
  return '<div class="overlay"><div class="modal">' +
    '<h3>'+t('change_mode_title')+'</h3>' +
    '<p>'+t('change_mode_body')+'</p>' +
    '<div class="modal-actions">' +
      '<button class="btn btn-ghost" data-action="close-change-mode">'+t('cancel')+'</button>' +
      '<button class="btn btn-primary" data-action="confirm-change-mode">'+t('confirm')+'</button>' +
    '</div>' +
  '</div></div>';
}
function renderSyncModal(){
  if(!state.syncing) return '';
  var checks = ['CHARGING SESSIONS','ENERGY DATA','USER ACTIVITY','SETTINGS','EVENTS','PAYMENT RECORDS'];
  var checksPt = ['SESSÕES DE CARREGAMENTO','DADOS DE ENERGIA','ATIVIDADE DO USUÁRIO','CONFIGURAÇÕES','EVENTOS','REGISTROS DE PAGAMENTO'];
  var checksEs = ['SESIONES DE CARGA','DATOS DE ENERGÍA','ACTIVIDAD DEL USUARIO','AJUSTES','EVENTOS','REGISTROS DE PAGO'];
  var labels = state.lang==='pt'?checksPt : state.lang==='es'?checksEs : checks;
  var pct = Math.round((state.syncStep/6)*100);
  return '<div class="overlay"><div class="modal sync-modal">' +
    '<h3>'+t('connection_restored')+'</h3>' +
    '<p style="margin-bottom:4px;">'+t('syncing')+'</p>' +
    '<div class="sync-progress-track"><div class="sync-progress-fill" style="width:'+pct+'%"></div></div>' +
    '<div style="text-align:left;">' + labels.map(function(l,i){
      return '<div class="sync-check '+(state.syncStep>i?'show':'')+'"><span class="mark">✓</span> '+l+'</div>';
    }).join('') + '</div>' +
    (state.syncStep>=6 ? '<div style="margin-top:14px; color:var(--green); font-weight:700; font-size:13px; letter-spacing:1px;">'+t('sync_complete')+'</div>' : '') +
  '</div></div>';
}
function renderDemoPanel(){
  var fab = '<button class="demo-fab" data-action="toggle-demo">'+t('demo_mode')+' ●</button>';
  if(!state.demoOpen) return fab;
  return fab + '<div class="demo-panel">' +
    '<h4>Veículo residencial</h4>' +
    '<button class="demo-btn" data-action="demo-set" data-kind="res-vehicle" data-value="disconnected">Desconectado</button>' +
    '<button class="demo-btn" data-action="demo-set" data-kind="res-vehicle" data-value="connected">Conectado</button>' +
    '<button class="demo-btn" data-action="demo-set" data-kind="res-vehicle" data-value="charging">Carregando</button>' +
    '<button class="demo-btn" data-action="demo-set" data-kind="res-vehicle" data-value="paused">Pausado</button>' +
    '<button class="demo-btn" data-action="demo-set" data-kind="res-vehicle" data-value="completed">Concluído</button>' +
    '<h4>Fluxo comercial</h4>' +
    '<button class="demo-btn" data-action="demo-set" data-kind="comm-step" data-value="idle">Aguardando autenticação</button>' +
    '<button class="demo-btn" data-action="demo-set" data-kind="comm-step" data-value="result">RFID detectado</button>' +
    '<button class="demo-btn" data-action="demo-set" data-kind="comm-step" data-value="charging">Pagamento autenticado / Carregando</button>' +
    '<button class="demo-btn" data-action="demo-set" data-kind="comm-step" data-value="completed">Sessão concluída</button>' +
    '<h4>Rede</h4>' +
    '<button class="demo-btn" data-action="demo-set" data-kind="online" data-value="online">Online</button>' +
    '<button class="demo-btn" data-action="demo-set" data-kind="online" data-value="offline">Offline</button>' +
    '<h4>Operação</h4>' +
    '<button class="demo-btn" data-action="demo-set" data-kind="demand" data-value="1">Alta demanda no local</button>' +
    '<button class="demo-btn" data-action="demo-set" data-kind="maintenance" data-value="1">Estação em manutenção</button>' +
    '<button class="demo-btn" data-action="demo-set" data-kind="error-station" data-value="1">Estação com erro</button>' +
  '</div>';
}

/* ============================================================
   ROOT RENDER
   ============================================================ */
function render(){
  var html = '<div class="app-shell">';
  html += renderTopNav();
  html += '<div class="main">';
  if(state.screen==='landing') html += screenLanding();
  else if(state.screen==='onboarding') html += screenOnboarding();
  else if(state.screen==='residential') html += screenResidential();
  else if(state.screen==='commercial') html += screenCommercial();
  html += '</div>';
  html += renderChangeModeModal();
  html += renderSyncModal();
  html += renderDemoPanel();
  html += '</div>';
  document.getElementById('app').innerHTML = html;
}

render();
})();
</script>
</body>
</html>
