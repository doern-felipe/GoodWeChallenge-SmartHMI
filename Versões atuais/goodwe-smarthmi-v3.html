<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoodWe Smart HMI — Protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root, :root:not([data-theme="light"]), :root[data-theme="dark"]{
  --bg-0:#050505;
  --bg-1:#0c0c0c;
  --bg-2:#141414;
  --bg-3:#1c1c1c;
  --border:#2a2a2a;
  --border-soft:#1f1f1f;
  --red:#FF0000;
  --red-2:#e00010;
  --red-dim:rgba(255,0,0,.12);
  --red-glow:rgba(255,0,0,.45);
  --green:#25d366;
  --green-dim:rgba(37,211,102,.12);
  --orange:#ffa726;
  --orange-dim:rgba(255,167,38,.12);
  --text-0:#f2f2f2;
  --text-1:#b5b5b5;
  --text-2:#7d7d7d;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-0);
  color:var(--text-0);
  font-family:var(--font);
  min-height:100vh;
  overflow-x:hidden;
  font-size:15px;
  line-height:1.5;
}
/* red/black gradient field + faint technical grid */
body::before{
  content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(1200px 700px at 50% -14%, rgba(255,0,0,.42) 0%, rgba(178,0,12,.18) 36%, rgba(0,0,0,0) 74%),
    radial-gradient(900px 700px at 105% 108%, rgba(255,0,0,.16) 0%, rgba(0,0,0,0) 65%),
    radial-gradient(800px 600px at -10% 95%, rgba(190,0,10,.12) 0%, rgba(0,0,0,0) 60%),
    linear-gradient(180deg,#160306 0%,#0d0203 26%,#050505 60%,#100204 100%);
}
body::after{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 78%);
  -webkit-mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 78%);
}
button{font-family:inherit;cursor:pointer;color:var(--text-0);}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:4px;}
::selection{background:var(--red);color:#fff;}
input,select{font-family:inherit;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}

/* ---------- icons ---------- */
svg.i{width:18px;height:18px;flex:0 0 auto;display:inline-block;vertical-align:-3px;}

/* ---------- logo ---------- */
.logo{display:block;height:22px;width:auto;}
.center>.logo,.landing>.logo,.wrap-sm.center .logo{margin-left:auto;margin-right:auto;}
.logo-lg{height:64px;}
.logo-md{height:34px;}
.logo-sm{height:15px;}
.logo-glow{filter:drop-shadow(0 0 22px rgba(255,0,0,.55));}

/* ---------- top bars ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:15px 26px;background:rgba(8,8,8,.86);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-soft);position:sticky;top:0;z-index:50;
}
.topbar-left{display:flex;align-items:center;gap:14px;background:none;border:none;padding:0;}
.topbar-left .sysname{font-size:12px;letter-spacing:4px;color:var(--text-1);font-weight:500;}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

.lang{display:flex;gap:2px;border:1px solid var(--border);border-radius:999px;padding:3px;background:rgba(20,20,20,.7);}
.lang button{border:none;background:transparent;color:var(--text-2);font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;transition:.15s;}
.lang button.on{background:var(--red);color:#fff;}
.lang button:not(.on):hover{color:var(--text-0);}

.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:rgba(20,20,20,.7);
  border-radius:999px;padding:7px 14px;font-size:12px;font-weight:600;color:var(--text-1);transition:.15s;}
.pill svg.i{width:15px;height:15px;}
.pill-online{border-color:rgba(37,211,102,.35);color:var(--green);}
.pill-offline{border-color:rgba(255,0,0,.45);color:var(--red);background:var(--red-dim);}
.pill-mode{border-color:rgba(255,0,0,.45);color:var(--red);background:var(--red-dim);font-weight:700;letter-spacing:1px;font-size:11px;}

/* second bar */
.subbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:0 26px;border-bottom:1px solid var(--border-soft);background:rgba(6,6,6,.7);
  position:sticky;top:57px;z-index:49;min-height:52px;
}
.tabs{display:flex;gap:4px;flex-wrap:wrap;}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--text-1);font-size:14px;font-weight:500;
  padding:15px 14px;display:inline-flex;align-items:center;gap:8px;transition:.15s;}
.tab:hover{color:var(--text-0);}
.tab.on{color:var(--red);border-bottom-color:var(--red);font-weight:600;}
.tab svg{width:16px;height:16px;}
.subbar-right{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:2px;color:var(--text-2);font-weight:500;}
.ctx-label{display:inline-flex;align-items:center;gap:9px;font-size:14px;font-weight:700;color:var(--red);letter-spacing:1px;}
.ctx-label .sub{color:var(--text-2);font-weight:400;letter-spacing:0;font-size:13px;}
.ctx-label svg.i{width:17px;height:17px;}
.btn-opaccess svg.i{width:15px;height:15px;}
.btn-opaccess{border:1px solid rgba(255,0,0,.45);background:var(--red-dim);color:var(--red);font-size:12px;font-weight:600;
  padding:8px 14px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;transition:.15s;}
.btn-opaccess:hover{background:rgba(255,0,0,.2);}

.offline-strip{background:linear-gradient(90deg,rgba(255,167,38,.14),rgba(255,167,38,.05));
  border-bottom:1px solid rgba(255,167,38,.25);color:var(--orange);text-align:center;
  font-size:12px;font-weight:700;letter-spacing:2px;padding:9px;}

/* ---------- layout ---------- */
.page{padding:44px 26px 110px;display:flex;flex-direction:column;align-items:center;}
.wrap{width:100%;max-width:1180px;margin:0 auto;}
.wrap-sm{width:100%;max-width:800px;margin:0 auto;}
.center{text-align:center;}
.fade{animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ---------- landing ---------- */
.landing{min-height:calc(100vh - 58px);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 24px 40px;text-align:center;}
.landing h1{
  font-size:clamp(42px,8vw,86px);font-weight:800;letter-spacing:3px;margin:26px 0 0;line-height:1;
  color:var(--red);text-shadow:0 0 34px rgba(255,0,0,.55),0 0 90px rgba(255,0,0,.25);
}
.landing .sub{margin:20px 0 0;font-size:clamp(14px,2.2vw,19px);font-weight:600;letter-spacing:4px;color:var(--text-0);}
.landing .sub .accent{color:var(--red);}
.landing .rule{width:76px;height:2px;background:var(--red);margin:30px auto 0;box-shadow:0 0 14px var(--red-glow);}
.landing .tagline{margin:26px auto 0;color:var(--text-1);font-size:14px;letter-spacing:1px;}

.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:46px auto 0;max-width:720px;width:100%;}
@media(max-width:660px){.choice-grid{grid-template-columns:1fr;}}
.choice{
  background:rgba(17,17,17,.78);border:1px solid var(--border);border-radius:var(--r-xl);padding:26px;
  text-align:left;transition:.2s;display:flex;flex-direction:column;gap:14px;backdrop-filter:blur(6px);
}
.choice:hover{border-color:rgba(255,0,0,.6);background:rgba(24,16,16,.85);transform:translateY(-3px);
  box-shadow:0 18px 44px rgba(0,0,0,.55),0 0 0 1px rgba(255,0,0,.12);}
.choice-head{display:flex;align-items:center;justify-content:space-between;}
.choice-ic{width:46px;height:46px;border-radius:var(--r-md);background:var(--red-dim);border:1px solid rgba(255,0,0,.3);
  display:flex;align-items:center;justify-content:center;color:var(--red);}
.choice-ic svg{width:22px;height:22px;}
.choice-arrow{color:var(--text-2);transition:.2s;display:flex;}
.choice-arrow svg.i{width:20px;height:20px;}
.choice:hover .choice-arrow{color:var(--red);transform:translateX(4px);}
.choice .eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--red);}
.choice h3{margin:0;font-size:24px;font-weight:700;}
.choice ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;}
.choice li{font-size:14px;color:var(--text-1);}

.feat-row{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin-top:44px;}
.feat{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text-1);}
.feat svg{width:16px;height:16px;color:var(--red);}
.disclaimer{margin-top:44px;font-size:12px;color:var(--text-2);letter-spacing:.3px;}

/* ---------- charger screens ---------- */
.eyebrow-c{font-size:12px;letter-spacing:6px;color:var(--text-2);font-weight:500;margin-bottom:12px;}
.state-title{font-size:clamp(28px,4.4vw,40px);font-weight:800;color:var(--red);margin:0;letter-spacing:-.5px;
  text-shadow:0 0 30px rgba(255,0,0,.4);}
.state-title.neutral{color:var(--text-0);text-shadow:none;}
.avail{margin-top:10px;font-size:17px;color:var(--text-1);display:inline-flex;align-items:center;gap:8px;justify-content:center;}
.avail b{color:var(--text-0);font-size:20px;font-weight:700;}
.avail svg{width:17px;height:17px;color:var(--red);}
.vstate{margin-top:20px;font-size:15px;color:var(--text-1);display:inline-flex;align-items:center;gap:9px;}
.vstate svg{width:17px;height:17px;color:var(--text-2);}
.vstate.ok{color:var(--green);}
.vstate.ok svg{color:var(--green);}

.big-circle{
  width:190px;height:190px;border-radius:50%;background:var(--red);border:none;color:#fff;
  font-size:20px;font-weight:700;line-height:1.25;margin:44px auto;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 12px rgba(255,0,0,.09),0 0 60px rgba(255,0,0,.5);transition:.2s;
}
.big-circle:hover{transform:scale(1.04);box-shadow:0 0 0 16px rgba(255,0,0,.12),0 0 80px rgba(255,0,0,.65);}
.big-circle:active{transform:scale(.98);}

.stat-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:12px;}
.stat{background:rgba(20,20,20,.8);border:1px solid var(--border-soft);border-radius:var(--r-md);padding:16px 26px;min-width:132px;text-align:center;}
.stat .lbl{font-size:11px;letter-spacing:2px;color:var(--text-2);font-weight:500;}
.stat .val{margin-top:7px;font-size:25px;font-weight:700;color:var(--red);}
.stat .val .u{font-size:13px;color:var(--text-1);font-weight:500;margin-left:3px;}
.stat .val.plain{color:var(--text-0);}

.ring-box{position:relative;width:260px;height:260px;margin:12px auto 6px;display:flex;align-items:center;justify-content:center;}
.ring-box .inner{position:absolute;text-align:center;}
.ring-box .pct{font-size:56px;font-weight:800;color:var(--red);line-height:1;text-shadow:0 0 30px rgba(255,0,0,.4);}
.ring-box .pct.green{color:var(--green);text-shadow:0 0 30px rgba(37,211,102,.35);}
.ring-box .cap{margin-top:8px;font-size:12px;letter-spacing:3px;color:var(--text-2);}

.btn{border:1px solid var(--border);background:rgba(22,22,22,.9);border-radius:var(--r-md);padding:15px 30px;
  font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:.15s;}
.btn:hover{background:var(--bg-3);border-color:#3a3a3a;}
.btn:active{transform:scale(.985);}
.btn svg{width:18px;height:18px;}
.btn-red{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 30px rgba(255,0,0,.3);}
.btn-red:hover{background:#ff2020;border-color:#ff2020;box-shadow:0 0 40px rgba(255,0,0,.45);}
.btn-danger{color:var(--red);border-color:rgba(255,0,0,.4);background:var(--red-dim);}
.btn-danger:hover{background:rgba(255,0,0,.2);}
.btn-sm{padding:9px 16px;font-size:13px;border-radius:var(--r-sm);}
.btn:disabled{opacity:.3;cursor:not-allowed;}
.btn-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:32px;}
.link-btn{background:none;border:none;color:var(--text-1);font-size:14px;margin-top:22px;transition:.15s;}
.link-btn:hover{color:var(--red);}

.quick-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:26px;}
.quick{background:rgba(20,20,20,.8);border:1px solid var(--border-soft);border-radius:var(--r-md);padding:16px 22px;
  min-width:130px;text-align:center;transition:.15s;}
.quick:hover{border-color:rgba(255,0,0,.45);background:rgba(26,18,18,.9);}
.quick svg{width:17px;height:17px;color:var(--red);}
.quick .lbl{margin-top:8px;font-size:10px;letter-spacing:1.6px;color:var(--text-2);font-weight:500;line-height:1.35;}
.quick .val{margin-top:7px;font-size:16px;font-weight:700;color:var(--text-0);}

/* scan */
.scan{width:160px;height:160px;margin:40px auto 0;border-radius:50%;border:2px solid rgba(255,0,0,.5);
  display:flex;align-items:center;justify-content:center;position:relative;color:var(--red);}
.scan svg{width:38px;height:38px;}
.scan::before,.scan::after{content:'';position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--red);
  animation:ripple 1.8s ease-out infinite;}
.scan::after{animation-delay:.9s;}
@keyframes ripple{0%{transform:scale(1);opacity:.7;}100%{transform:scale(1.55);opacity:0;}}
.scan-line{position:absolute;left:8%;right:8%;height:2px;background:var(--red);box-shadow:0 0 12px var(--red);
  animation:scanmove 1.8s ease-in-out infinite;}
@keyframes scanmove{0%,100%{top:22%;}50%{top:76%;}}

/* auth methods */
.auth-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:22px;}
.auth{width:140px;background:rgba(20,20,20,.82);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:28px 14px;transition:.2s;}
.auth:hover{border-color:rgba(255,0,0,.6);background:rgba(28,16,16,.9);transform:translateY(-3px);}
.auth svg{width:28px;height:28px;color:var(--red);}
.auth .lb{margin-top:14px;font-size:14px;font-weight:600;color:var(--text-0);}
.label-sm{font-size:11px;letter-spacing:3px;color:var(--text-2);margin:34px 0 0;}

/* info card */
.info-card{background:rgba(18,18,18,.86);border:1px solid var(--border-soft);border-radius:var(--r-lg);
  padding:8px 22px;max-width:460px;margin:22px auto 0;text-align:left;}
.info-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--border-soft);font-size:14px;}
.info-row:last-child{border-bottom:none;}
.info-row .k{color:var(--text-2);}
.info-row .v{font-weight:600;color:var(--text-0);}
.info-row .v.red{color:var(--red);}

.power-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px;}
.pw{min-width:110px;background:rgba(20,20,20,.82);border:1px solid var(--border);border-radius:var(--r-md);
  padding:18px 12px;font-size:17px;font-weight:700;transition:.15s;color:var(--text-0);}
.pw:hover:not(:disabled){border-color:rgba(255,0,0,.5);}
.pw.on{border-color:var(--red);background:var(--red-dim);color:var(--red);}
.pw:disabled{opacity:.28;cursor:not-allowed;}
.note-sm{margin-top:16px;font-size:12px;color:var(--text-2);display:inline-flex;align-items:center;gap:7px;}
.note-sm svg{width:14px;height:14px;}

/* cost boxes */
.cost-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
.cost{background:rgba(20,20,20,.8);border:1px solid var(--border-soft);border-radius:var(--r-md);
  padding:15px 22px;display:flex;align-items:center;gap:16px;min-width:230px;justify-content:space-between;}
.cost .lbl{font-size:11px;letter-spacing:1.6px;color:var(--text-2);display:inline-flex;align-items:center;gap:7px;}
.cost .lbl svg.i{width:15px;height:15px;}
.cost .val{font-size:19px;font-weight:700;color:var(--red);}
.cost .val.plain{color:var(--text-0);}

/* ---------- section head ---------- */
.sec-head{display:flex;align-items:center;gap:11px;margin:0 0 22px;}
.sec-head svg{width:21px;height:21px;color:var(--red);}
.sec-head h2{margin:0;font-size:23px;font-weight:700;}

/* ---------- profiles ---------- */
.prof-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;}
@media(max-width:760px){.prof-grid{grid-template-columns:1fr;}}
.prof{background:rgba(18,18,18,.86);border:1px solid var(--border-soft);border-radius:var(--r-lg);padding:22px;}
.prof-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.prof-name{font-size:19px;font-weight:800;letter-spacing:.5px;}
.prof-badge{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);}
.prof-badge svg{width:15px;height:15px;}
.prof-line{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--text-1);padding:4px 0;}
.prof-line svg{width:14px;height:14px;color:var(--text-2);}
.c-red{color:var(--red);} .c-green{color:var(--green);} .c-orange{color:var(--orange);}
.banner{display:flex;align-items:center;gap:12px;background:rgba(18,18,18,.8);border:1px solid var(--border-soft);
  border-radius:var(--r-lg);padding:18px 22px;margin-top:20px;font-size:14px;color:var(--text-1);}
.banner svg{width:18px;height:18px;color:var(--red);flex-shrink:0;}
.foot-note{text-align:center;font-size:12px;color:var(--text-2);margin-top:18px;}

/* ---------- lists / tables ---------- */
.list-card{background:rgba(18,18,18,.86);border:1px solid var(--border-soft);border-radius:var(--r-lg);overflow:hidden;}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 22px;border-bottom:1px solid var(--border-soft);}
.list-row:last-child{border-bottom:none;}
.list-row .main{font-size:16px;font-weight:700;}
.list-row .sub{font-size:12px;color:var(--text-2);margin-top:3px;}
.list-row .side{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--text-1);font-weight:600;}
.list-row .side svg{width:14px;height:14px;color:var(--text-2);}

.tbl{width:100%;border-collapse:collapse;}
.tbl th{text-align:left;font-size:11px;letter-spacing:1.6px;color:var(--text-2);font-weight:500;
  padding:15px 22px;border-bottom:1px solid var(--border-soft);background:rgba(255,255,255,.02);}
.tbl th:last-child,.tbl td:last-child{text-align:right;}
.tbl td{padding:16px 22px;border-bottom:1px solid var(--border-soft);font-size:14px;color:var(--text-1);}
.tbl tr:last-child td{border-bottom:none;}
.tbl .u-cell{display:flex;align-items:center;gap:12px;}
.tbl svg.i{width:15px;height:15px;color:var(--text-2);}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--red-dim);border:1px solid rgba(255,0,0,.3);
  color:var(--red);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
.u-name{color:var(--text-0);font-weight:600;}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.5px;}
.sess{display:inline-flex;align-items:center;gap:6px;color:var(--text-0);font-weight:700;}
.sess svg{width:14px;height:14px;color:var(--red);}
.tbl-scroll{overflow-x:auto;}

/* status grid */
.status-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
@media(max-width:620px){.status-grid{grid-template-columns:1fr;}}
.status-item{display:flex;align-items:center;gap:11px;background:rgba(18,18,18,.82);border:1px solid var(--border-soft);
  border-radius:var(--r-md);padding:16px 20px;font-size:15px;color:var(--text-0);}
.status-item svg{width:17px;height:17px;color:var(--green);}

.field label{display:block;font-size:13px;color:var(--text-1);margin-bottom:7px;}

.sw::after{content:'';position:absolute;width:23px;height:23px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;}

function mkStations(){
  var avail=[1,7,10,13], err=[3], maint=[5];
  var pwSet=[22,18.4,16,11,7.4], out=[], ui=0;
  for(var i=1;i<=24;i++){
    var s={id:i};
    if(err.indexOf(i)>=0) s.status='error';
    else if(maint.indexOf(i)>=0) s.status='maintenance';
    else if(avail.indexOf(i)>=0) s.status='available';
    else s.status='charging';
    if(s.status==='charging'){
      s.power = (i===4||i===8) ? 18.4 : pwSet[(i*3)%pwSet.length];
      s.user  = (i===4) ? 'João Silva' : ST_NAMES[ui++ % ST_NAMES.length];
      s.energy = +(s.power*0.69 + (i%5)).toFixed(1);
      s.elapsed = (i===4) ? 37*60+21 : ((i*617)%3400)+300;
      s.rfid='****'+(4000+(i*137)%5900);
      s.pay='Visa ••••'+(1000+(i*311)%8900);
      s.cost=+(s.energy*1.89).toFixed(2);
    }
    // Salva o estado dos botoes internos do operador
    s.opts = { load: true, rfid: true, rep: false };
    out.push(s);
  }
  return out;
}

/* =============== helpers =============== */
function pad(n){ return (n<10?'0':'')+n; }
function hms(s){ s=Math.floor(s); return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60); }
function mmss(s){ s=Math.max(0,Math.floor(s)); return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60)); }
function eta(sec){ sec=Math.max(0,Math.round(sec)); var h=Math.floor(sec/3600),m=Math.round(sec%3600/60);
  return (h>0?h+'h ':'')+m+'min'; }
function brl(v){ return 'R$ '+v.toFixed(2).replace('.',','); }
// Agora o Ring aceita um idSuffix para atualizacao live via DOM
function ring(pct,color,size,sw,idSuffix){
  size=size||260; sw=sw||10;
  var r=(size-sw)/2, c=2*Math.PI*r, off=c-(Math.max(0,Math.min(100,pct))/100)*c;
  var idStr = idSuffix ? ' id="'+idSuffix+'"' : '';
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
   '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="'+sw+'"/>'+
   '<circle'+idStr+' cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+sw+'" '+
     'stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" '+
     'transform="rotate(-90 '+size/2+' '+size/2+')" style="transition:stroke-dashoffset .6s ease;filter:drop-shadow(0 0 10px '+color+'88)"/></svg>';
}
function statusText(st){ return t('s_'+st); }

/* =============== ticker =============== */
// Este ticker agora não faz rebuild de HTML por segundo, ele altera o texto direto no elemento (DOM)
setInterval(function(){
  var dirty=false;
  var r=S.res;
  if(S.view==='res' && r.v==='charging'){
    r.sec++; r.energy+=r.power/3600;
    r.batt=Math.min(r.target, r.batt+(r.power/3600)/45*100);
    if(r.batt>=r.target-0.01){ 
        r.batt=r.target; r.v='done'; dirty=true; 
    } else if(r.tab==='charger') {
        var elPct=document.getElementById('res-pct');
        var elEn=document.getElementById('res-energy');
        var elTm=document.getElementById('res-time');
        var elRg=document.getElementById('res-ring-circ');
        if(elPct) elPct.innerText = Math.round(r.batt)+'%';
        if(elEn) elEn.innerText = r.energy.toFixed(1);
        if(elTm) elTm.innerText = hms(r.sec);
        if(elRg){
            var cr=2*Math.PI*125;
            elRg.style.strokeDashoffset = (cr-(Math.max(0,Math.min(100,r.batt))/100)*cr).toFixed(1);
        }
    }
  }
  var c=S.com;
  if(S.view==='com' && c.step==='charging'){
    c.sec++; c.energy+=c.power/3600; c.cost=+(c.energy*c.tariff).toFixed(2);
    c.batt=Math.min(100, c.batt+(c.power/3600)/55*100);
    if(c.batt>=99.99){ 
        c.step='done'; dirty=true; 
    } else if(c.tab==='charger') {
        var elPct=document.getElementById('com-pct');
        var elEn=document.getElementById('com-energy');
        var elTm=document.getElementById('com-time');
        var elCost=document.getElementById('com-cost');
        var elRem=document.getElementById('com-rem');
        var elRg=document.getElementById('com-ring-circ');
        if(elPct) elPct.innerText = Math.round(c.batt)+'%';
        if(elEn) elEn.innerText = c.energy.toFixed(1);
        if(elTm) elTm.innerText = hms(c.sec);
        if(elCost) elCost.innerText = brl(c.cost);
        if(elRem){
            var rem=(c.power>0)?((100-c.batt)/100*55)/c.power*3600:0;
            elRem.innerText = mmss(rem);
        }
        if(elRg){
            var cc=2*Math.PI*125;
            elRg.style.strokeDashoffset = (cc-(Math.max(0,Math.min(100,c.batt))/100)*cc).toFixed(1);
        }
    }
  }
  // So recarrega se o status de verdade mudou (ex: de carregando para done)
  if(dirty) render();
},1000);

 resNew:function(){ S.res.v='idle'; S.res.batt=42; S.res.energy=0; S.res.sec=0; },
 limit:function(v){ S.res.limit=+v; },
 timer:function(v){ S.res.timer = (S.res.timer===+v?null:+v); },
 lockT:function(){ S.res.lock=!S.res.lock; },
 loadT:function(){ S.res.load=!S.res.load; },
 day:function(i){ S.res.sched.d[+i]=S.res.sched.d[+i]?0:1; },

 auth:function(m){ S.com.method=m; S.com.step='scan'; render();
   setTimeout(function(){ S.com.step='ident'; S.com.user='João Silva'; render(); },1700); },
 toPower:function(){ S.com.step='power'; },
 selPower:function(v){ if(+v<=S.com.max) S.com.sel=+v; },
 comStart:function(){ var c=S.com; c.power=c.sel; c.step='charging'; c.batt=64; c.energy=0; c.sec=0; c.cost=0; },
 comPause:function(){ S.com.step='paused'; },
 comResume:function(){ S.com.step='charging'; },
 comStop:function(){ S.com.step='done'; },
 comNew:function(){ var c=S.com; c.step='idle'; c.method=null; c.user=null; c.batt=64; c.energy=0; c.sec=0; c.cost=0; c.err=false; },
 comRetry:function(){ S.com.err=false; S.com.step='idle'; S.com.tab='charger'; },

 station:function(id){ S.op.station=+id; window.scrollTo(0,0); },
 opBack:function(){ S.op.station=null; },
 opToggle:function(k){ 
    var s = S.stations.filter(function(x){return x.id===S.op.station;})[0];
    if(s) s.opts[k] = !s.opts[k];
 },
 openCfg:function(k){ S.modal={type:'cfg',key:k}; },
 closeModal:function(){ S.modal=null; },
 demoT:function(){ S.demo=!S.demo; },

 dm:function(k){
   var c=S.com, r=S.res;
   switch(k){
     case 'net': A.toggleNet(); S.demo=false; return;
     case 'vconn': S.view='res'; S.res.tab='charger'; r.v='connected'; break;
     case 'vdis': S.view='res'; S.res.tab='charger'; r.v='idle'; r.batt=42; r.energy=0; r.sec=0; break;
     case 'charge':
       if(S.view==='com'){ c.step='charging'; c.user=c.user||'João Silva'; c.tab='charger'; }
       else { S.view='res'; S.res.tab='charger'; if(r.v==='idle') r.v='connected'; r.v='charging'; }
       break;
     case 'pause':
       if(S.view==='com') c.step='paused'; else r.v='paused'; break;
     case 'finish':
       if(S.view==='com'){ c.step='done'; } else { r.v='done'; r.batt=r.target; } break;
     case 'error': S.view='com'; S.com.tab='error'; S.com.err=true; break;
     case 'b20': r.batt=20; c.batt=20; break;
     case 'b42': r.batt=42; c.batt=42; break;
     case 'b63': r.batt=63; c.batt=63; break;
     case 'b90': r.batt=90; c.batt=90; break;
     case 'rfid': S.view='com'; c.tab='charger'; c.step='ident'; c.method='rfid'; c.user='João Silva'; break;
     case 'high': S.view='op'; S.op.tab='ops'; S.op.station=null; S.siteLimit=280; break;
     case 'norm': S.view='op'; S.op.tab='ops'; S.op.station=null; S.siteLimit=300; break;
     case 'st3': S.view='op'; S.op.tab='stations'; S.op.station=3; break;
     case 'reset':
       S.res={tab:'charger',v:'idle',batt:42,target:80,power:10.8,energy:0,sec:0,limit:32,lock:false,load:true,timer:null,
              sched:{s:'22:00',e:'06:00',t:80,d:[1,1,1,1,1,0,0]}};
       S.com={tab:'charger',step:'idle',method:null,user:null,batt:64,energy:0,sec:0,power:18.4,sel:11,max:11,tariff:1.89,cost:0,err:false};
       S.op={tab:'stations',station:null}; S.siteLimit=300; S.online=true; S.sync=0; S.view='landing';
       break;
   }
   S.demo=false;
 }
};

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]'); if(!el) return;
  var fn=A[el.dataset.a]; if(!fn) return;
  
  // Limita a super-animação apens às navegações de tela grandes, para ser suave
  var navs = ['nav','pickMode','resTab','comTab','opTab','toOp','toCom','station','opBack'];
  if(navs.indexOf(el.dataset.a) > -1) {
    S.animateNext = true; 
  }
  fn(el.dataset.v); render();
});

// Evento disparado CONTINUAMENTE enquanto arrasta o slider
document.addEventListener('input',function(e){
  var el=e.target.closest('[data-b]'); if(!el) return;
  var b=el.dataset.b;
  if(b==='site'){ 
    S.siteLimit=+el.value;
    // Modifica o DOM direto para nao "soltar" o slider do seu mouse
    var valDisplay = el.parentElement.querySelector('.big');
    if(valDisplay) valDisplay.innerHTML = S.siteLimit + ' kW';
  }
  if(b==='ss'){ S.res.sched.s=el.value; }
  if(b==='se'){ S.res.sched.e=el.value; }
  if(b==='st'){ S.res.sched.t=+el.value; }
});

// Evento disparado APENAS QUANDO SOLTA o clique no slider
document.addEventListener('change',function(e){
  var el=e.target.closest('[data-b]'); if(!el) return;
  render();
});

function resCharger(){
  var r=S.res;
  if(r.v==='idle'||r.v==='connecting'){
    var connecting = r.v==='connecting';
    return '<div class="wrap-sm center">'+
      '<div class="eyebrow-c">'+t('home')+'</div>'+
      '<h1 class="state-title">'+t('ready')+'</h1>'+
      '<div class="avail">'+ic('zap')+'<b>11 kW</b> '+t('available')+'</div>'+
      '<div><span class="vstate">'+ic('plug')+(connecting?t('connecting'):t('v_not_conn'))+'</span></div>'+
      (connecting
        ? '<div class="scan" style="margin:34px auto 44px">'+ic('plug')+'<div class="scan-line"></div></div>'
        : '<button class="big-circle" data-a="connect">'+t('connect_v')+'</button>')+
      '<div class="stat-row">'+
        statBox(t('power'),'0','kW')+statBox(t('energy'),'0','kWh')+
        statBox(t('time'),'00:00','')+statBox(t('lockL'),r.lock?t('on'):t('off'),'')+
      '</div></div>';
  }
  if(r.v==='connected'){
    var need=(r.target-r.batt)/100*45, secs=need/r.power*3600;
    return '<div class="wrap-sm center">'+
      '<div><span class="vstate ok">'+ic('check')+t('v_conn')+'</span></div>'+
      '<div class="ring-box">'+ring(r.batt,'var(--red)')+
        '<div class="inner"><div class="pct">'+Math.round(r.batt)+'%</div>'+
        '<div class="cap">'+t('target')+' '+r.target+'%</div></div></div>'+
      '<div class="stat-row">'+statBox(t('power'),r.power.toFixed(1),'kW')+
        statBox(t('eta'),'~'+eta(secs),'',true)+'</div>'+
      '<div class="btn-row"><button class="btn btn-red" data-a="resStart">'+ic('play')+t('start_charge')+'</button></div>'+
      '<div class="quick-row">'+
        quick('sliders',t('curr_limit_s'),r.limit+' A')+
        quick('calendar',t('schedule').toUpperCase(),r.sched.s.slice(0,2)+'–'+r.sched.e.slice(0,2))+
        quick('clock','TIMER',r.timer?(r.timer<60?r.timer+' min':(r.timer/60)+'h'):t('disabled'))+
        quick(r.lock?'lock':'unlock',t('lock').toUpperCase(),r.lock?t('enabled'):t('disabled'))+
      '</div>'+
      '<button class="link-btn" data-a="disconnect">'+t('disconnect')+'</button></div>';
  }
  if(r.v==='charging'||r.v==='paused'){
    var charging=r.v==='charging';
    return '<div class="wrap-sm center">'+
      '<div><span class="vstate" style="color:var(--red)">'+ic('zap')+
        '<span style="letter-spacing:2px;font-weight:700">'+(charging?t('charging'):t('paused'))+'</span></span></div>'+
      '<div class="ring-box">'+ring(r.batt,'var(--red)', 260, 10, 'res-ring-circ')+
        '<div class="inner"><div class="pct" id="res-pct">'+Math.round(r.batt)+'%</div>'+
        '<div class="cap">'+t('target')+' '+r.target+'%</div></div></div>'+
      '<div class="stat-row">'+statBox(t('power'),(charging?r.power:0).toFixed(1),'kW')+
        statBox(t('energy'),'<span id="res-energy">'+r.energy.toFixed(1)+'</span>','kWh')+
        statBox(t('time'),'<span id="res-time">'+hms(r.sec)+'</span>','',true)+'</div>'+
      '<div class="btn-row">'+
        (charging?'<button class="btn btn-red" data-a="resPause">'+ic('pause')+t('pause_charge')+'</button>'
                 :'<button class="btn btn-red" data-a="resResume">'+ic('play')+t('resume_charge')+'</button>')+
        '<button class="btn" data-a="resStop">'+ic('stop')+t('stop_charge')+'</button></div></div>';
  }
  // done
  return '<div class="wrap-sm center">'+
    '<div><span class="vstate ok">'+ic('check')+
      '<span style="letter-spacing:2px;font-weight:700">'+t('completed')+'</span></span></div>'+
    '<div class="ring-box">'+ring(r.batt,'var(--green)')+

function opLoad(){
  var ch=S.stations.filter(function(s){return s.status==='charging';});
  var raw=ch.reduce(function(a,s){return a+s.power;},0);
  var over=raw>S.siteLimit;
  var k=over?S.siteLimit/raw:1;                 // load management throttles proportionally
  var demand=+(raw*k).toFixed(1);
  var pct=Math.min(100,demand/S.siteLimit*100);
  var maxP=Math.max.apply(null,ch.map(function(s){return s.power;}));
  return '<div class="wrap">'+
    '<div class="sec-head">'+ic('gauge')+'<h2>'+t('load_title')+'</h2></div>'+
    '<div class="load-cards">'+
      '<div class="load-card"><div class="lbl">'+t('site_limit')+'</div><div class="big">'+S.siteLimit+' kW</div>'+
        '<input type="range" min="120" max="400" step="10" value="'+S.siteLimit+'" data-b="site" aria-label="'+t('site_limit')+'"></div>'+
      '<div class="load-card"><div class="lbl">'+t('cur_demand')+'</div>'+
        '<div class="big" style="'+(over?'color:var(--orange)':'')+'">'+demand.toFixed(1)+' kW</div>'+
        '<div class="demand-track"><div class="demand-fill '+(over?'over':'')+'" style="width:'+pct+'%"></div></div></div>'+
      '<div class="load-card ok"><div class="lbl">'+t('lm_state')+'</div>'+
        '<div class="big">'+ic('gauge')+t('active')+'</div>'+
        '<div style="margin-top:10px;font-size:12px;color:var(--text-1)">'+
        (over ? (S.lang==='pt'?'Reduzindo potência das estações para respeitar o limite.':
                 S.lang==='es'?'Reduciendo potencia de las estaciones para respetar el límite.':
                 'Reducing station power to respect the limit.')
              : (S.lang==='pt'?'Demanda dentro do limite do site.':
                 S.lang==='es'?'Demanda dentro del límite del sitio.':'Demand within site limit.'))+'</div></div>'+
    '</div>'+
    '<div class="bars-card"><div class="bars-head">'+t('st_charging')+' · '+ch.length+(over?' · '+(S.lang==='pt'?'POTÊNCIA LIMITADA PELO SITE':S.lang==='es'?'POTENCIA LIMITADA POR EL SITIO':'POWER CAPPED BY SITE LIMIT'):'')+'</div>'+
      ch.map(function(s){
        var eff=+(s.power*k).toFixed(1);
        var w=eff/maxP*100;
        return '<div class="bar-row"><span class="nm">'+ic('zap')+'STATION '+pad(s.id)+'</span>'+
          '<span class="bar-track"><span class="bar-fill '+(over?'throttled':'')+'" style="width:'+w.toFixed(1)+'%"></span></span>'+
          '<span class="bar-val">'+eff.toFixed(1)+' kW'+(over?' <span style="color:var(--text-2);font-weight:500">/ '+s.power+'</span>':'')+'</span></div>';
      }).join('')+'</div></div>';
}
function barChart(data,labels,color){
  var w=520,h=230,pl=42,pb=26,pt2=10,max=280;
  var iw=w-pl-8, ih=h-pb-pt2, bw=iw/data.length*0.6, gap=iw/data.length;
  var g='';
  [0,70,140,210,280].forEach(function(v){
    var y=pt2+ih-(v/max)*ih;
    g+='<line x1="'+pl+'" y1="'+y+'" x2="'+w+'" y2="'+y+'" stroke="rgba(255,255,255,.07)" stroke-dasharray="3 4"/>'+
       '<text x="'+(pl-8)+'" y="'+(y+4)+'" fill="#7d7d7d" font-size="10" text-anchor="end">'+v+'</text>';
  });
  data.forEach(function(v,i){
    var bh=(v/max)*ih, x=pl+gap*i+(gap-bw)/2, y=pt2+ih-bh;
    g+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="'+color+'" rx="2"/>'+
       '<text x="'+(pl+gap*i+gap/2).toFixed(1)+'" y="'+(h-8)+'" fill="#b5b5b5" font-size="10" text-anchor="middle">'+labels[i]+'</text>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet">'+g+'</svg>';
}
function lineChart(data,labels,color,max,area,wide){
  var w=wide?1120:520,h=wide?250:230,pl=42,pb=26,pt2=10,pr=26;
  var iw=w-pl-pr, ih=h-pb-pt2, step=iw/(data.length-1);
  var g='', pts=[];
  var grid=[0,max*0.25,max*0.5,max*0.75,max];
  grid.forEach(function(v){
    var y=pt2+ih-(v/max)*ih;
    g+='<line x1="'+pl+'" y1="'+y+'" x2="'+(w-6)+'" y2="'+y+'" stroke="rgba(255,255,255,.07)" stroke-dasharray="3 4"/>'+
       '<text x="'+(pl-8)+'" y="'+(y+4)+'" fill="#7d7d7d" font-size="10" text-anchor="end">'+Math.round(v)+'</text>';
  });
  data.forEach(function(v,i){
    var x=pl+step*i, y=pt2+ih-(v/max)*ih;
    pts.push([x,y]);
    g+='<text x="'+x.toFixed(1)+'" y="'+(h-8)+'" fill="#b5b5b5" font-size="10" text-anchor="middle">'+labels[i]+'</text>';
  });
  var d=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
  if(area){
    var ad=d+' L'+pts[pts.length-1][0].toFixed(1)+' '+(pt2+ih)+' L'+pts[0][0].toFixed(1)+' '+(pt2+ih)+' Z';
    g+='<path d="'+ad+'" fill="'+color+'" opacity=".18"/>';
  }
  g+='<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
  if(!area) pts.forEach(function(p){ g+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5" fill="'+color+'"/>'; });
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet">'+g+'</svg>';
}

    case 'cfg_energy':return [[(S.lang==='pt'?'Consumo semanal':'Weekly consumption'),'1,32 MWh'],
                              [(S.lang==='pt'?'Pico de demanda':'Peak demand'),'286,8 kW'],
                              [(S.lang==='pt'?'Fator de carga':'Load factor'),'0,71']];
    case 'cfg_maint': return [['STATION 05',(S.lang==='pt'?'Manutenção programada':'Scheduled maintenance')],
                              ['STATION 03',(S.lang==='pt'?'Chamado aberto':'Open ticket')]];
    case 'cfg_diag':  return [[t('d_power'),'OK'],[t('d_temp'),'42 °C'],[t('d_veh'),'ISO 15118'],[t('d_ctrl'),'OK']];
    case 'cfg_net':   return [['4G/LTE',(S.lang==='pt'?'Conectado':S.lang==='es'?'Conectado':'Connected')],
                              ['Ethernet',(S.lang==='pt'?'Conectado':S.lang==='es'?'Conectado':'Connected')],
                              ['Wi-Fi',(S.lang==='pt'?'Em espera':S.lang==='es'?'En espera':'Standby')]];
    case 'cfg_fw':    return [['HMI Core','v3.2.1'],['Power Controller','v1.8.0'],['Comms Module','v2.0.4 · OTA']];
    case 'cfg_int':   return [['OCPP 2.0.1',(S.lang==='pt'?'Ativo':S.lang==='es'?'Activo':'Active')],
                              ['MODBUS TCP',(S.lang==='pt'?'Ativo':S.lang==='es'?'Activo':'Active')],
                              ['SEMS Portal',(S.lang==='pt'?'Conectado':S.lang==='es'?'Conectado':'Connected')]];
    default:          return [[(S.lang==='pt'?'Operadores':S.lang==='es'?'Operadores':'Operators'),'5'],
                              [(S.lang==='pt'?'Organização':S.lang==='es'?'Organización':'Organization'),'FIAP · Equipe 02'],
                              [(S.lang==='pt'?'Fuso horário':S.lang==='es'?'Zona horaria':'Time zone'),'America/Sao_Paulo']];
  }
}
function vModal(){
  if(!S.modal) return '';
  var key=S.modal.key, icon=(CFG.filter(function(c){return c[0]===key;})[0]||['','settings'])[1];
  return '<div class="ov"><button class="ov-bg" data-a="closeModal" aria-label="'+t('close')+'"></button><div class="modal">'+
    '<div class="modal-head"><span class="t">'+ic(icon)+t(key)+'</span>'+
      '<button class="modal-x" data-a="closeModal" aria-label="'+t('close')+'">'+ic('x')+'</button></div>'+
    '<div class="det-card" style="padding:0 2px;background:none;border:none">'+
      cfgRows(key).map(function(r){return infoRow(r[0],r[1]);}).join('')+'</div>'+
    '<div class="modal-actions"><button class="btn" data-a="closeModal">'+t('close')+'</button>'+
      '<button class="btn btn-red" data-a="closeModal">'+t('save')+'</button></div>'+
    '<div class="modal-lock">'+ic('lock')+t('restricted')+'</div></div></div>';
}
function vSync(){
  if(!S.sync) return '';
  var items=['sy1','sy2','sy3','sy4','sy5','sy6'];
  var done=S.sync>=7;
  return '<div class="ov"><div class="modal" style="max-width:400px">'+
    '<div class="modal-head"><span class="t">'+ic('refresh')+t('conn_restored')+'</span></div>'+
    '<p style="margin-bottom:4px">'+(done?t('sync_done'):t('syncing'))+'</p>'+
    '<div class="sync-track"><div class="sync-fill" id="sync-fill-bar" style="width:'+Math.min(100,S.sync/6*100)+'%"></div></div>'+
    items.map(function(k,i){
      return '<div class="sync-item '+(S.sync>i?'on':'')+'" id="sync-item-'+i+'">'+ic('check')+t(k)+'</div>';
    }).join('')+
    (done?'<div class="sync-done">'+t('sync_done')+'</div>':'')+
  '</div></div>';
}
function vDemo(){
  var fab='<button class="demo-fab" data-a="demoT">'+ic('sliders')+t('demo')+'</button>';
  if(!S.demo) return fab;
  function db(k,label,cls,icon){
    return '<button class="db '+(cls||'')+'" data-a="dm" data-v="'+k+'">'+(icon?ic(icon):'')+label+'</button>';
  }
  return fab+'<div class="demo-panel">'+
    '<div class="modal-head" style="margin-bottom:6px"><h4>'+t('demo')+'</h4>'+
      '<button class="modal-x" data-a="demoT" aria-label="'+t('close')+'">'+ic('x')+'</button></div>'+
    '<div class="demo-sec">'+t('d_conn')+'</div><div class="demo-grid one">'+
      db('net', S.online?(t('online')+' → '+t('offline')):(t('offline')+' → '+t('online')),'',S.online?'wifioff':'wifi')+'</div>'+
    '<div class="demo-sec">'+t('d_veh_s')+'</div><div class="demo-grid">'+
      db('vconn',t('d_connected'),'','plug')+db('vdis',t('d_disconnected'),'')+'</div>'+
    '<div class="demo-sec">'+t('d_state')+'</div><div class="demo-grid">'+
      db('charge',t('d_charge'),'red','zap')+db('pause',t('d_pause'),'orange')+
      db('finish',t('d_finish'),'')+db('error',t('d_error'),'red','alert')+'</div>'+
    '<div class="demo-sec">'+t('d_batt')+'</div><div class="demo-grid four">'+
      db('b20','20%','')+db('b42','42%','')+db('b63','63%','')+db('b90','90%','')+'</div>'+
    '<div class="demo-sec">'+t('d_auth')+'</div><div class="demo-grid one">'+
      db('rfid',t('d_rfid'),'red','card')+'</div>'+
    '<div class="demo-sec">'+t('d_op')+'</div><div class="demo-grid one">'+
      db('high',t('d_high'),'orange','gauge')+db('norm',t('d_norm'),'')+db('st3',t('d_st3'),'red','wrench')+'</div>'+
    '<div style="height:14px"></div><div class="demo-grid one">'+db('reset',t('d_reset'),'','refresh')+'</div>'+
  '</div>';
}

/* =============== render =============== */
function render(){
  var h='';
  if(S.view!=='landing' && S.view!=='onboarding') h+=topbar();
  else h+=topbar();
  if(S.view==='landing') h+=vLanding();
  else if(S.view==='onboarding') h+=vOnboarding();
  else if(S.view==='res') h+=vRes();
  else if(S.view==='com') h+=vCom();
  else if(S.view==='op') h+=vOp();
  h+=vModal()+vSync()+vDemo();
  document.getElementById('app').innerHTML=h;
  S.animateNext = false;
}
render();
})();
</script>
</body>
</html>
